name: akmon

on: [push, pull_request]

jobs:
  akmon:
    runs-on: ubuntu-latest
    env:
      # the checks need no browser; skip puppeteer's Chrome for Testing download
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx akmon sync --check
      - run: npx akmon verify --strict
      # The extension has no build step: these four are its whole quality gate
      - run: npm run i18n:check
      - run: npm run test:tools
      - run: npm run test:gateway
      - run: npm run test:dz23
      - run: npm run test:mcp
      - run: npm run test:quant
      - run: npm run lint
      - run: npm run test:bridge
      - run: npm run test:pine-ui
      - run: npm run test:settings-ui
